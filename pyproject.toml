[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-lora-helpdesk"
version = "0.1.0"
description = "Parameter-Efficient Fine-Tuning with LoRA from scratch on BERT-Base"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "TfMarra5" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "gradio>=4.0.0"
]
